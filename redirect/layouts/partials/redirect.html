{{- $target := printf "%s%s" site.Params.destinationBaseURL .TargetPath -}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta http-equiv="refresh" content="0; url={{ $target }}">
  <link rel="canonical" href="{{ $target }}">
  <title>Site moved | Bradley Fidler</title>
  <script>
    (() => {
      const destination = new URL({{ site.Params.destinationBaseURL | jsonify | safeJS }});
      destination.pathname = window.location.pathname;
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --desk: #172631;
      --desk-rule: #314450;
      --paper: #dce8d4;
      --paper-band: #ceddc7;
      --ink: #17252e;
      --muted: #52625f;
      --stamp: #9e2549;
      --hole-rim: #91a69a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 5vw, 3rem);
      background:
        linear-gradient(90deg, transparent 49.85%, var(--desk-rule) 50%, transparent 50.15%),
        var(--desk);
      color: var(--ink);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    }

    main {
      position: relative;
      width: min(100%, 48rem);
      overflow: hidden;
      padding: clamp(2.75rem, 8vw, 5rem) clamp(3rem, 10vw, 6.5rem);
      background: repeating-linear-gradient(
        to bottom,
        var(--paper) 0,
        var(--paper) 1.5rem,
        var(--paper-band) 1.5rem,
        var(--paper-band) 3rem
      );
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
    }

    main::before,
    main::after {
      position: absolute;
      inset-block: 0;
      width: 1.6rem;
      background: radial-gradient(
        circle at center,
        var(--desk) 0 0.27rem,
        var(--hole-rim) 0.28rem 0.34rem,
        transparent 0.35rem
      );
      background-size: 100% 1.5rem;
      content: "";
    }

    main::before {
      left: 0.45rem;
    }

    main::after {
      right: 0.45rem;
    }

    .kicker {
      margin: 0 0 1rem;
      color: var(--stamp);
      font-size: clamp(0.68rem, 2vw, 0.82rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 10ch;
      margin: 0;
      font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
      font-size: clamp(2.8rem, 11vw, 6.2rem);
      font-stretch: condensed;
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 0.86;
      text-transform: uppercase;
    }

    .route {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 0.8rem 1.25rem;
      margin: clamp(2.25rem, 7vw, 4rem) 0 0;
      padding-block: 1.1rem;
      border-block: 2px solid var(--ink);
      font-size: clamp(0.78rem, 2.5vw, 1rem);
      line-height: 1.5;
    }

    dt {
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
    }

    s {
      text-decoration-color: var(--stamp);
      text-decoration-thickness: 0.16em;
    }

    a {
      color: var(--ink);
      font-weight: 700;
      text-decoration-color: var(--stamp);
      text-decoration-thickness: 0.12em;
      text-underline-offset: 0.2em;
    }

    a:focus-visible {
      outline: 3px solid var(--stamp);
      outline-offset: 0.3rem;
    }

    .note {
      max-width: 38rem;
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.08rem);
      line-height: 1.55;
    }

    @media (max-width: 32rem) {
      main {
        padding-inline: 2.75rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Routing notice · effective now</p>
    <h1>Forwarding address</h1>
    <dl class="route">
      <dt>From</dt>
      <dd><s>brfid.github.io</s></dd>
      <dt>To</dt>
      <dd><a href="{{ $target }}">{{ $target }}</a></dd>
    </dl>
    <p class="note">You’re being sent to the site’s current address. If the transfer stalls, use the destination above.</p>
  </main>
</body>
</html>

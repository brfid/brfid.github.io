name: Publish site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A commit message containing [nopublish] skips this workflow.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[nopublish]')"
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'
          extended: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install PDF dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -m playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils

      - name: Quality checks
        run: make check

      - name: Run vintage pipeline
        id: vintage
        env:
          GIT_SHA: ${{ github.sha }}
          ALLOW_LOCAL_IMAGE_BUILD: "0"
        run: |
          set -euo pipefail

          BUILD_ID="build-$(date -u '+%Y%m%d-%H%M%S')"
          LOG_DIR=/tmp/edcloud-vintage
          echo "log_file=${LOG_DIR}/${BUILD_ID}.log" >> "$GITHUB_OUTPUT"

          if ! bash scripts/vintage-runner.sh "$BUILD_ID"; then
            echo "::error::Vintage pipeline failed. The runner's log tail appears above."
            exit 1
          fi

          # The bind-mounted guest artifact can be root-owned.
          sudo chown -R "$(id -u):$(id -g)" build/vintage

          mkdir -p hugo/static
          for artifact in brad.bio.txt build.log.html pipeline-status.json; do
            if [[ ! -s "build/vintage/${artifact}" ]]; then
              echo "::error::Final vintage artifact is missing or empty: build/vintage/${artifact}"
              exit 1
            fi
          done

          # Never serve the raw bio if a stale generated file exists.
          rm -f hugo/static/brad.bio.txt
          echo "brad.bio.txt sha256: $(sha256sum build/vintage/brad.bio.txt | cut -d' ' -f1)"
          cp build/vintage/build.log.html hugo/static/build.log.html
          cp build/vintage/pipeline-status.json hugo/static/pipeline-status.json
          .venv/bin/python -m json.tool hugo/static/pipeline-status.json >/dev/null

          .venv/bin/python -m resume_generator.vintage_contract \
            build/vintage/brad.bio.txt \
            site.yaml \
            resume.yaml

      - name: Generate bio data for Hugo
        run: |
          .venv/bin/python -m resume_generator.bio_yaml \
            build/vintage/brad.bio.txt \
            hugo/data/bio.yaml \
            --build-log hugo/static/build.log.html \
            --pipeline-status hugo/static/pipeline-status.json \
            --build-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Build Hugo site and public resume PDF
        run: make resume-pdf-public

      - name: Verify production output
        env:
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          .venv/bin/python scripts/verify_site.py site \
            --production \
            --resume-yaml resume.yaml \
            --build-run-url "$BUILD_RUN_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages (attempt 1/3)
        id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Deploy to GitHub Pages (attempt 2/3)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Deploy to GitHub Pages (attempt 3/3)
        id: deployment
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # Preserve direct runner diagnostics when the stdout tail is insufficient.
      - name: Upload vintage pipeline diagnostics
        if: failure() && steps.vintage.outputs.log_file != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: vintage-pipeline-log
          path: |
            ${{ steps.vintage.outputs.log_file }}
            build/vintage/pipeline-status.json
            build/vintage/sections.jsonl
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        run: |
          PAGE_URL="${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url || 'https://brfid.github.io' }}"
          echo "## Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

name: Publish site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A commit message containing [nopublish] skips this workflow.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[nopublish]')"
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'
          extended: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install PDF dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils

      # Artifact markers remain on stdout; verbose output goes to LOG_DIR.
      - name: Run vintage pipeline
        id: vintage
        env:
          GIT_SHA: ${{ github.sha }}
          ALLOW_LOCAL_IMAGE_BUILD: "0"
        run: |
          set -euo pipefail

          BUILD_ID="build-$(date -u '+%Y%m%d-%H%M%S')"
          LOG_DIR=/tmp/edcloud-vintage
          echo "log_file=${LOG_DIR}/${BUILD_ID}.log" >> "$GITHUB_OUTPUT"

          if ! bash scripts/edcloud-vintage-runner.sh "$BUILD_ID" > /tmp/vintage-stdout.txt; then
            echo "::error::Vintage pipeline failed. Runner stdout follows (the runner emits its own log tail there)."
            cat /tmp/vintage-stdout.txt >&2
            exit 1
          fi

          # The root-owned bind-mount artifacts must be writable by this step.
          sudo chown -R "$(id -u):$(id -g)" build/vintage

          mkdir -p hugo/static build/vintage

          # The rendered bio is the pipeline's only page-content input.
          awk '/^<<<BRAD_BIO_TXT_BASE64_BEGIN>>>/{flag=1;next}/^<<<BRAD_BIO_TXT_BASE64_END>>>/{flag=0}flag' /tmp/vintage-stdout.txt \
            | tr -d '\n' > /tmp/brad.bio.txt.b64
          if [[ ! -s /tmp/brad.bio.txt.b64 ]]; then
            echo "::error::brad.bio.txt marker block missing from runner stdout"
            cat /tmp/vintage-stdout.txt >&2
            exit 1
          fi
          base64 -d /tmp/brad.bio.txt.b64 > build/vintage/brad.bio.txt
          # Never serve the raw bio if a stale generated file exists.
          rm -f hugo/static/brad.bio.txt

          echo "brad.bio.txt sha256: $(sha256sum build/vintage/brad.bio.txt | cut -d' ' -f1)"

          awk '/^<<<BUILD_LOG_BASE64_BEGIN>>>/{flag=1;next}/^<<<BUILD_LOG_BASE64_END>>>/{flag=0}flag' /tmp/vintage-stdout.txt \
            | tr -d '\n' > /tmp/build.log.b64
          if [[ ! -s /tmp/build.log.b64 ]]; then
            echo "::error::build.log.html marker block missing from runner stdout"
            exit 1
          fi
          base64 -d /tmp/build.log.b64 > hugo/static/build.log.html

          awk '/^<<<PIPELINE_STATUS_JSON_BASE64_BEGIN>>>/{flag=1;next}/^<<<PIPELINE_STATUS_JSON_BASE64_END>>>/{flag=0}flag' /tmp/vintage-stdout.txt \
            | tr -d '\n' > /tmp/pipeline-status.json.b64
          if [[ ! -s /tmp/pipeline-status.json.b64 ]]; then
            echo "::error::pipeline-status.json marker block missing from runner stdout"
            exit 1
          fi
          base64 -d /tmp/pipeline-status.json.b64 > hugo/static/pipeline-status.json
          .venv/bin/python -m json.tool hugo/static/pipeline-status.json >/dev/null

          .venv/bin/python -m resume_generator.vintage_contract \
            build/vintage/brad.bio.txt \
            site.yaml \
            resume.yaml

      - name: Generate bio data for Hugo
        run: |
          .venv/bin/python -m resume_generator.bio_yaml \
            build/vintage/brad.bio.txt \
            hugo/data/bio.yaml \
            --build-log hugo/static/build.log.html \
            --pipeline-status hugo/static/pipeline-status.json \
            --build-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Build Hugo site and public resume PDF
        run: make resume-pdf-public

      - name: Verify production output
        env:
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          .venv/bin/python scripts/verify_site.py site \
            --production \
            --resume-yaml resume.yaml \
            --build-run-url "$BUILD_RUN_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages (attempt 1/3)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to GitHub Pages (attempt 2/3)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to GitHub Pages (attempt 3/3)
        id: deployment
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Preserve the full log when the runner's stdout tail is insufficient.
      - name: Upload vintage pipeline log
        if: failure() && steps.vintage.outputs.log_file != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vintage-pipeline-log
          path: |
            ${{ steps.vintage.outputs.log_file }}
            /tmp/vintage-stdout.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        run: |
          PAGE_URL="${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url || 'https://brfid.github.io' }}"
          echo "## Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

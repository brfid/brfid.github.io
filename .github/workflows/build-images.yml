name: Build vintage pipeline images

# Publishes SHA-tagged amd64 images and reports their immutable digests.
# Pin both digests in the runner and validate the pair before merging.
# Keep both GitHub packages public so runners can pull them without credentials.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vax-pexpect
        id: vax
        uses: docker/build-push-action@v6
        with:
          context: .
          file: vintage/machines/vax/Dockerfile.vax-pexpect
          platforms: linux/amd64
          push: true
          tags: ghcr.io/brfid/vax-pexpect:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=vax-pexpect
          cache-to: type=gha,mode=max,scope=vax-pexpect

      - name: Build and push pdp11-pexpect
        id: pdp11
        uses: docker/build-push-action@v6
        with:
          context: .
          file: vintage/machines/pdp11/Dockerfile.pdp11-pexpect
          platforms: linux/amd64
          push: true
          tags: ghcr.io/brfid/pdp11-pexpect:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pdp11-pexpect
          cache-to: type=gha,mode=max,scope=pdp11-pexpect

      - name: Summary
        run: |
          echo "## Immutable images built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/brfid/vax-pexpect@${{ steps.vax.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/brfid/pdp11-pexpect@${{ steps.pdp11.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin both digests in \`scripts/vintage-runner.sh\`, then run \`vintage-validate.yml\`." >> "$GITHUB_STEP_SUMMARY"

; VAX 11/780 with 4.3BSD and a local console
;
; Console is stdin/stdout (no telnet). No network. No terminal multiplexer.
; Disk images must be decompressed to RA81.000 / RA81VHD.001 before use.
; SIMH working directory must be /image so relative disk paths resolve.
;
; For use with the vax-pexpect Docker image (Dockerfile.vax-pexpect).

set cpu idle=QUASIJARUS
set cpu 64m
set prompt "vaxbsd>> "
set tti 7b
set tto 7b

; DZ-11 terminal multiplexer disabled
set dz disabled

; DHU-11 and card reader disabled
set vh disabled
set cr disabled

; Unused printers and disks disabled
set lpt disabled
set rp disabled
set rl disabled
set hk disabled
set rk disabled

; RA81 MSCP disks expanded during the image build
set rq enabled
set rq0 ra81
att rq0 RA81.000
set rq1 format=vhd
set rq1 ra81
att rq1 RA81VHD.001
set rq2 disabled
set rq3 disabled

set ry disabled
set tu disabled

; Tape devices disabled
set ts disabled

; Network devices disabled
set xu disabled
set tq disabled
set dmc disabled

; Persist TODR state in OS-agnostic mode. Default VMS mode can derive a clock
; offset that makes 4.3BSD reboot and panic before login.
attach todr /image/todr.dat

; Boot program
; R10=9 (RA device major), R11=0 (autoboot)
load -o boot43 0
d r10 9
d r11 0

echo ================================================================
echo = VAX 4.3BSD pexpect mode; console is stdin/stdout            =
echo = Root has no password. No telnet ports.                       =
echo ================================================================

; Boot
run 2

; Exit SIMH when BSD halts.
quit

; PDP-11/73 with 2.11BSD on a local standard-input and standard-output console.

; PDP-11/73 with 4 MB memory
set cpu 11/73 4M
; Do not enable SIMH idle detection; it calls `ps`, which is absent from the image.

; RP06 disk with the prebuilt 2.11BSD image
set rp0 enable
set rp0 RP06
attach rp0 /opt/pdp11/211bsd_rpeth.dsk

; Disable unused devices
set xq disabled
set rl disable
set hk disable
set rk disable
set tm disable
set ts disable

; Boot from disk; the script selects the default unix kernel.
boot rp0

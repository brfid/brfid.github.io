    summary: "Built the documentation platform for a security intelligence company serving 800+ customers, with reproducible delivery, OpenAPI contracts, automated validation, and documentation integrated into release workflows."
    highlights:
    - Migrated the site from MkDocs to Astro and Starlight and rebuilt its Docker pipeline. The documentation team now operates the site, build tooling, and multi-format changelog directly.
    - Wrote and maintained OpenAPI specifications used for reference documentation, code generation, and contract tests against API behavior.
    - Integrated documentation into release workflows, supporting same-day critical updates, publication at tech preview, and reviewed engineering contributions.
    - Wrote documentation for the customer-facing DomainTools MCP server and contributed its resource and tool definitions to the product codebase. Built a reusable cold-start harness for validating documentation coverage.
    - Built an internal MCP server that exposes documentation quality checks as callable tools and evaluated its tool descriptions against model behavior.
    - Built a human-reviewed memory system for documentation agents in which reusable guidance requires approval in git.

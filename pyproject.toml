[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brfid-resume"
version = "0.1.0"
description = "Hugo site tooling with Playwright-generated resume PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = [
  # Each Playwright release selects a Chromium build that affects PDF pagination.
  # Inspect the PDF output when updating this exact pin.
  "playwright==1.62.0",
]
dev = [
  "mypy>=1.8",
  "pexpect>=4.9",
  "pylint>=3.0",
  "pytest>=8.0",
  "ruff>=0.6.0",
  "types-PyYAML",
  "vulture>=2.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["resume_generator*"]

[tool.mypy]
python_version = "3.11"
files = ["resume_generator", "scripts", "tests"]
mypy_path = "scripts"
warn_unused_configs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
  "playwright",
  "playwright.*",
  "pexpect",
  "yaml",
  "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "S",   # flake8-bandit
  "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # assert
  "D",    # test docstrings are intentionally sparse
  "S108", # tests use representative /tmp paths inside simulated guests
]
"scripts/pdp11_pexpect.py" = ["S108"] # fixed /tmp paths are inside the isolated PDP-11 guest
"scripts/vax_pexpect.py" = ["S108"] # fixed /tmp paths are inside the isolated VAX guest
[tool.pylint.main]
py-version = "3.11"
jobs = 0

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
# Ruff enforces Google-style docstrings in source; tests are exempt.
disable = [
    "too-many-instance-attributes",  # R0902: Config classes need many attributes
    "too-many-locals",  # R0914: Parser functions need many variables
    "too-many-branches",  # R0912: Parser functions have many cases
    "too-many-statements",  # R0915: Parser functions are naturally long
    "too-many-lines",  # C0302: Build pipeline modules can be long
]

[tool.vulture]
min_confidence = 80
exclude = [".venv", "site", "templates", "tests"]

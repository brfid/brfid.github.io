[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brfid-site"
version = "0.1.0"
description = "Hugo site tooling with Playwright-generated resume PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  # Check PDF pagination after upgrading.
  "playwright==1.65.2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pylint>=4.0.9",
  "pytest>=8.0",
  "ruff>=0.6.0",
  "types-PyYAML",
  "vulture>=2.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["site_tools*"]

[tool.mypy]
python_version = "3.11"
files = ["site_tools", "tests"]
warn_unused_configs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
  "playwright",
  "playwright.*",
  "yaml",
  "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Hugo, Chromium, localhost, or PDF inspection tools"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "S",   # flake8-bandit
  "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # assert
  "D",    # test docstrings are intentionally sparse
]
[tool.pylint.main]
py-version = "3.11"
jobs = 0

[tool.pylint.format]
max-line-length = 120

[tool.vulture]
min_confidence = 80
exclude = [".venv", "site", "tests"]

{{- /* Preload the two self-hosted fonts used above the fold. */}}
<link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
{{- /* Prefer the SVG favicon over PaperMod's ICO fallback. */}}
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
{{- /* Keep every Hugo-rendered page out of search indexes. */}}
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
{{- /* Apply the site palette when PaperMod's JavaScript theme switcher is absent. */}}
<noscript>
  <style>
    @media (prefers-color-scheme: dark) {
      :root {
        --theme: #141a15;
        --entry: #1c231d;
        --primary: #e7e3d4;
        --secondary: #8a9c8c;
        --tertiary: #2b342c;
        --content: #e7e3d4;
        --border: #2b342c;
        --code-bg: #1c231d;
        --code-block-bg: #171d18;
        --forest: #7fbf8e;
        --interactive-hover: #b8f5c2;
      }
    }
  </style>
</noscript>

{{- /* Keep heading permalinks available to keyboard users as well as pointer
     users; content.css reveals them on heading hover or link focus. */ -}}
{{ . | replaceRE
    "(<h[1-6] id=\"([^\"]+)\".+)(</h[1-6]+>)"
    "${1}<a class=\"anchor\" aria-label=\"Link to this section\" href=\"#${2}\">#</a>${3}"
    | safeHTML
}}

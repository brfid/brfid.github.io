baseURL = "https://brfid.gitlab.io/"
locale = "en-US"
title = "Bradley Fidler"
theme = "PaperMod"
publishDir = "../site"
disableKinds = ["sitemap", "taxonomy", "term"]

# Use only the static hugo/static/robots.txt file.
enableRobotsTXT = false
buildDrafts = false
buildFuture = false
disableAliases = false

[pagination]
  pagerSize = 10

[[cascade]]
  [cascade.params]
    robotsNoIndex = true

[params.label]
  text = "brfid.gitlab.io"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Blog"
    pageRef = "/posts"
    weight = 1
  [[menu.main]]
    identifier = "resume"
    name = "Resume"
    pageRef = "/resume"
    weight = 5
    [menu.main.params]
      companionurl = "/resume.pdf"
      companionlabel = "Download resume PDF"
  [[menu.main]]
    identifier = "source"
    name = "Source"
    url = "https://gitlab.com/brfid/brfid.gitlab.io"
    weight = 10

[params]
  env = "production"
  author = "Bradley Fidler"
  hideAuthor = true
  description = "Bradley Fidler, Principal Technical Writer."
  mainSections = ["posts"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowFullTextinRSS = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false

  [params.assets]
    theme_color = "#f4f1e6"
    msapplication_TileColor = "#f4f1e6"

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    noClasses = false
    style = "monokai"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
